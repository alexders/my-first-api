name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen

      - name: Ruff 静态检查
        run: uv run ruff check

      - name: Ruff 格式检查
        run: uv run ruff format --check

      - name: 单元测试
        run: uv run pytest -q
