<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SSE 流式输出演示</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0f1115;
    color: #e6e6e6;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card { width: min(560px, 88vw); }
  h1 { font-size: 15px; font-weight: 500; color: #8b93a1; margin: 0 0 16px; }
  button {
    appearance: none;
    border: 0;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #22c55e;
    color: #04260f;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  #out {
    margin-top: 18px;
    min-height: 90px;
    padding: 16px;
    border-radius: 10px;
    background: #171a21;
    border: 1px solid #232833;
    font-size: 18px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #status { margin-top: 10px; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <div class="card">
    <h1>SSE 流式输出演示</h1>
    <button id="btn">开始</button>
    <div id="out"></div>
    <div id="status">等待开始</div>
  </div>
  <script>
    const btn = document.getElementById("btn");
    const out = document.getElementById("out");
    const status = document.getElementById("status");
    let es = null;

    btn.addEventListener("click", () => {
      if (es) es.close();
      out.textContent = "";
      status.textContent = "连接中…";
      btn.disabled = true;

      es = new EventSource("/chat/stream");

      es.onopen = () => {
        status.textContent = "已连接，等待数据";
      };

      es.onmessage = (e) => {
        out.textContent += e.data;
        status.textContent = "已接收 " + out.textContent.length + " 个字";
      };

      es.addEventListener("done", () => {
        es.close();
        es = null;
        btn.disabled = false;
        status.textContent = "完成，共 " + out.textContent.length + " 个字";
      });

      es.onerror = () => {
        if (es) {
          es.close();
          es = null;
        }
        btn.disabled = false;
        status.textContent = "连接中断";
      };
    });
  </script>
</body>
</html>
