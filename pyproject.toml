[project]
name = "my-first-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chenzhongli", email = "1532294251@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.9",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
my-first-api = "my_first_api.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.0",
]

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true
[tool.ruff.lint]
ignore = ["B008"]
